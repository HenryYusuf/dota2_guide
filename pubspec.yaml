name: dota2_guide
description: "Aegis Codex — unofficial, offline-first Dota 2 reference companion."
# Private package: never publish to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management — the single state mechanism (spec: repository contracts
  # consumed via Riverpod providers).
  flutter_riverpod: ^3.4.3

  # Navigation — the single navigation mechanism (spec: four bottom tabs via a
  # stateful shell route).
  go_router: ^18.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints, activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
