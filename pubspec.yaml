name: dota2_guide
description: "Aegis Codex — unofficial, offline-first Dota 2 reference companion."
# Private package: never publish to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter

  # State management — the single state mechanism (spec: repository contracts
  # consumed via Riverpod providers).
  flutter_riverpod: ^3.4.3

  # Navigation — the single navigation mechanism (spec: four bottom tabs via a
  # stateful shell route).
  go_router: ^18.1.0
  http: ^1.6.0
  path_provider: ^2.1.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints, activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Snapshotted game data bundled for offline first launch (emitted by
  # `dart run tool/snapshot.dart`). Valve CDN media is deliberately absent —
  # portraits/videos stream at runtime, never bundled (ADR-0001).
  assets:
    - assets/data/
